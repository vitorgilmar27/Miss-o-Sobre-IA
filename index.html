<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Você decide o futuro da IA</title>
</head>
<body>
    <div class="caixa-principal">
        <header>
            <span class="badge">Decisão & Impacto</span>
            <h1>Você Decide o Futuro da IA</h1>
            <div class="container-progresso">
                <div class="barra-progresso" id="barra-progresso"></div>
            </div>
            <p class="contador-passos" id="contador-passos">Pergunta 1</p>
        </header>

        <main>
            <div class="caixa-perguntas"></div>
            <div class="caixa-alternativas"></div>
            <div class="caixa-resultado">
                <p class="texto-resultado"></p>
                <button class="btn-reiniciar" id="btn-reiniciar" style="display: none;">Jogar Novamente</button>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
